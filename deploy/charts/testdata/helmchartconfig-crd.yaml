# Test only (deploy/fleet/smoke.sh on kind): a minimal stand-in for the HelmChartConfig CRD of
# RKE2's and k3s's helm-controller, so that the rke2-traefik bundle has somewhere to go. kind has
# no helm-controller; k3s (k3d) has the real CRD, and there this file is not applied. Nothing acts
# on the object here: the smoke installs rke2-traefik itself with the same values.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmchartconfigs.helm.cattle.io
spec:
  group: helm.cattle.io
  names:
    kind: HelmChartConfig
    listKind: HelmChartConfigList
    plural: helmchartconfigs
    singular: helmchartconfig
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                valuesContent:
                  type: string
              x-kubernetes-preserve-unknown-fields: true
