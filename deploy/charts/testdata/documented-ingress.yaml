# Fixture for test.sh: an HTTPS-only Ingress, a websecure IngressRoute with tls, a DNS-01 ACME
# Issuer and a Service on 443 pass check-ingress.py.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: documented
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: coldframe-tls
      hosts:
        - coldframe.example.invalid
        - api.coldframe.example.invalid
  rules:
    - host: coldframe.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
    - host: api.coldframe.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: documented
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.coldframe.example.invalid`)
      kind: Rule
      services:
        - name: keycloak
          port: 8080
  tls:
    secretName: coldframe-tls
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: documented
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: coldframe-letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: coldframe-dns01
              key: api-token
---
apiVersion: v1
kind: Service
metadata:
  name: https
spec:
  type: ClusterIP
  selector:
    app: traefik
  ports:
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
