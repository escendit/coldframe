# A disposable PostgreSQL for deploy/charts/smoke.sh ONLY. It stands in for the CloudNativePG
# cluster of Story 2.3: the Service is named coldframe-db-rw, and the roles and databases match
# what the charts expect. No persistence, no backups.
#
# The role passwords come from the placeholder Secrets the smoke run creates (deploy/SECRETS.md);
# the superuser password from the smoke-only Secret smoke-postgres-superuser.
apiVersion: v1
kind: ConfigMap
metadata:
  name: smoke-postgres-init
data:
  10-coldframe.sh: |
    #!/bin/sh
    # Runs once, on the empty data directory. Passwords are passed as psql variables.
    set -eu
    psql -v ON_ERROR_STOP=1 --username postgres --dbname postgres \
      -v server_user="${SERVER_USER}" -v server_password="${SERVER_PASSWORD}" \
      -v temporal_user="${TEMPORAL_USER}" -v temporal_password="${TEMPORAL_PASSWORD}" \
      -v keycloak_user="${KEYCLOAK_USER}" -v keycloak_password="${KEYCLOAK_PASSWORD}" <<'SQL'
    CREATE ROLE :"server_user" LOGIN PASSWORD :'server_password';
    CREATE ROLE :"temporal_user" LOGIN PASSWORD :'temporal_password';
    CREATE ROLE :"keycloak_user" LOGIN PASSWORD :'keycloak_password';
    CREATE DATABASE coldframe OWNER :"server_user";
    CREATE DATABASE temporal OWNER :"temporal_user";
    CREATE DATABASE temporal_visibility OWNER :"temporal_user";
    CREATE DATABASE keycloak OWNER :"keycloak_user";
    SQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smoke-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's "postgres" user.
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smoke-postgres-superuser
                  key: password
            - name: SERVER_USER
              valueFrom:
                secretKeyRef:
                  name: coldframe-db-server
                  key: username
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coldframe-db-server
                  key: password
            - name: TEMPORAL_USER
              valueFrom:
                secretKeyRef:
                  name: coldframe-db-temporal
                  key: username
            - name: TEMPORAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coldframe-db-temporal
                  key: password
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: coldframe-db-keycloak
                  key: username
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coldframe-db-keycloak
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "--username", "postgres", "--host", "127.0.0.1"]
            periodSeconds: 2
            failureThreshold: 60
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: init
          configMap:
            name: smoke-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: coldframe-db-rw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smoke-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
