# Fleet bundle "keycloak" (Story 2.5a): the chart in this folder as release "keycloak" in namespace
# coldframe (deploy/charts/README.md). Site values: hostname and the realm ConfigMap; the
# chart's defaults name the in-cluster services.
defaultNamespace: coldframe
labels:
  coldframe.escendit.io/bundle: keycloak
dependsOn:
  - selector:
      matchLabels:
        coldframe.escendit.io/bundle: database
  - selector:
      matchLabels:
        coldframe.escendit.io/bundle: ingress
helm:
  releaseName: keycloak
  timeoutSeconds: 900
  # Site values: key "keycloak" of the ConfigMap coldframe-values
  # (deploy/fleet/values.example.yaml).
  valuesFrom:
    - configMapKeyRef:
        name: coldframe-values
        namespace: coldframe
        key: keycloak
