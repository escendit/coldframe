{{- /* The value guards live here: helm fails the whole release when they fail. */ -}}
{{- include "ingress.validate" . -}}
{{- if .Values.acme.enabled }}
# Namespaced, not a ClusterIssuer: the DNS-01 token Secret lives in the releases' namespace.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: coldframe-letsencrypt
  labels:
    {{- include "ingress.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.acme.server | quote }}
    {{- with .Values.acme.email }}
    email: {{ . | quote }}
    {{- end }}
    privateKeySecretRef:
      # Generated by cert-manager: the ACME account key.
      name: coldframe-letsencrypt-account
    # DNS-01 only: no inbound traffic, nothing on port 80 (AD-13).
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: coldframe-dns01
              key: api-token
{{- end }}
