# cert-manager renews at 2/3 of the lifetime (its default renewBefore).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: coldframe-tls
  labels:
    {{- include "ingress.labels" . | nindent 4 }}
spec:
  # Generated by cert-manager: the key and certificate the Ingress serves.
  secretName: coldframe-tls
  dnsNames:
    {{- range $component := splitList " " (include "ingress.components" .) }}
    - {{ include "ingress.host" (list $ $component) | quote }}
    {{- end }}
  issuerRef:
    group: cert-manager.io
    {{- if .Values.acme.enabled }}
    kind: Issuer
    name: coldframe-letsencrypt
    {{- else }}
    kind: {{ .Values.externalIssuer.kind | quote }}
    name: {{ .Values.externalIssuer.name | quote }}
    {{- end }}
