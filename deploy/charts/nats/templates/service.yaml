apiVersion: v1
kind: Service
metadata:
  name: {{ include "nats.fullname" . }}
  labels:
    {{- include "nats.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nats.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: {{ int .Values.service.port }}
      targetPort: client
      protocol: TCP
