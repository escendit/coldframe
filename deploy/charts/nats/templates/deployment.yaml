apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nats.fullname" . }}
  labels:
    {{- include "nats.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nats.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nats.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "nats.podSecurityContext" . | nindent 8 }}
        fsGroup: {{ int .Values.runAsUser }}
      containers:
        - name: nats
          image: {{ include "nats.image" (list . .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --port=4222
            - --http_port=8222
            - --jetstream
            - --store_dir=/data
          securityContext:
            {{- include "nats.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: monitoring
              containerPort: 8222
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitoring
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: jetstream
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: jetstream
          emptyDir:
            sizeLimit: {{ .Values.jetstream.storageSizeLimit }}
