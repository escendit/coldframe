# Fleet bundle "web" (Story 2.5a): the chart in this folder as release "web" in namespace coldframe
# (deploy/charts/README.md). Site values: the issuer and the origin; the chart's
# defaults name the in-cluster services.
defaultNamespace: coldframe
labels:
  coldframe.escendit.io/bundle: web
dependsOn:
  - selector:
      matchLabels:
        coldframe.escendit.io/bundle: server
  - selector:
      matchLabels:
        coldframe.escendit.io/bundle: keycloak
helm:
  releaseName: web
  timeoutSeconds: 600
  # Site values: key "web" of the ConfigMap coldframe-values
  # (deploy/fleet/values.example.yaml).
  valuesFrom:
    - configMapKeyRef:
        name: coldframe-values
        namespace: coldframe
        key: web
