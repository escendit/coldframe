{{/*
Sets up and updates the schemas of both databases before the server is installed or upgraded.
Idempotent: setup-schema -v 0.0 only creates the version tables when they are missing, and
update-schema applies only the versions the database does not have yet. The databases and the
role exist already (Story 2.3).
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "temporal.fullname" . }}-schema
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ int .Values.adminTools.backoffLimit }}
  activeDeadlineSeconds: {{ int .Values.adminTools.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "temporal.labels" . | nindent 8 }}
        app.kubernetes.io/component: schema
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "temporal.podSecurityContext" . | nindent 8 }}
      containers:
        - name: schema
          image: {{ include "temporal.image" (list . .Values.adminTools.image) | quote }}
          imagePullPolicy: {{ .Values.adminTools.image.pullPolicy }}
          securityContext:
            {{- include "temporal.containerSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -ec
            - |
              schema=/etc/temporal/schema/postgresql/v12
              temporal-sql-tool --database "${DATABASE}" setup-schema -v 0.0
              temporal-sql-tool --database "${DATABASE}" update-schema -d "${schema}/temporal/versioned"
              temporal-sql-tool --database "${VISIBILITY_DATABASE}" setup-schema -v 0.0
              temporal-sql-tool --database "${VISIBILITY_DATABASE}" update-schema -d "${schema}/visibility/versioned"
          env:
            - name: SQL_PLUGIN
              value: postgres12
            - name: SQL_HOST
              value: {{ .Values.database.host | quote }}
            - name: SQL_PORT
              value: {{ int .Values.database.port | quote }}
            {{- include "temporal.databaseCredentials" (list "SQL_USER" "SQL_PASSWORD") | nindent 12 }}
            - name: DATABASE
              value: {{ .Values.database.name | quote }}
            - name: VISIBILITY_DATABASE
              value: {{ .Values.database.visibilityName | quote }}
          {{- with .Values.adminTools.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
