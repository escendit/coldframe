suite: server migration Job
templates:
  - templates/migrations-job.yaml
tests:
  - it: runs before every install and upgrade, replacing the previous Job only then
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "0"
            helm.sh/hook-delete-policy: before-hook-creation

  - it: runs the migrations image at the chart's appVersion
    chart:
      appVersion: 9.8.7
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/escendit/coldframe/migrations:9.8.7

  - it: fails fast and is bounded in time
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 1
      - equal:
          path: spec.activeDeadlineSeconds
          value: 600
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  - it: runs as the numeric non-root user with a restricted security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1654
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

  - it: does not select the Server's pods
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: migrations
