suite: server renders no Secret and reads credentials from the fixed Secrets
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/migrations-job.yaml
tests:
  - it: renders no Secret, with default values
    asserts:
      - isKind:
          of: Secret
        not: true

  - it: renders no Secret, with CI values
    values:
      - ../ci-values.yaml
    asserts:
      - isKind:
          of: Secret
        not: true

  - it: reads the database credentials and the client secret from the contract
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: coldframe-db-coldframe
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: coldframe-db-coldframe
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Keycloak__ClientSecret
            valueFrom:
              secretKeyRef:
                name: coldframe-oidc-clients
                key: server-client-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ConnectionStrings__coldframe
            value: Host=coldframe-db-rw;Port=5432;Database=coldframe;Username=$(DB_USERNAME);Password=$(DB_PASSWORD)

  - it: gives the migration Job the same database credentials
    template: templates/migrations-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: coldframe-db-coldframe
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: coldframe-db-coldframe
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ConnectionStrings__coldframe
            value: Host=coldframe-db-rw;Port=5432;Database=coldframe;Username=$(DB_USERNAME);Password=$(DB_PASSWORD)
