suite: server renders no Secret and reads credentials from the fixed Secrets
templates:
  - templates/deployment.yaml
  - templates/service.yaml
  - templates/migrations-job.yaml
  - templates/partitions-cronjob.yaml
tests:
  - it: renders no Secret, with default values
    asserts:
      - isKind:
          of: Secret
        not: true

  - it: renders no Secret, with CI values
    values:
      - ../ci-values.yaml
    asserts:
      - isKind:
          of: Secret
        not: true

  - it: reads the Device enrolment keys from the contract
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Enrolment__PrivateKeyPem
            valueFrom:
              secretKeyRef:
                name: coldframe-enrolment-key
                key: private-key.pem
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Enrolment__DeviceKeyEncryptionKey
            valueFrom:
              secretKeyRef:
                name: coldframe-device-kek
                key: kek

  - it: reads no push credential by default, so the Server starts without the Secret coldframe-push
    template: templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: Push__Apns__PrivateKeyPem
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: Push__Apns__KeyId
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: Push__Apns__TeamId
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: Push__Fcm__ServiceAccountJson

  - it: reads the APNs key from the contract when APNs is enabled, and nothing of FCM
    template: templates/deployment.yaml
    set:
      push.apns.enabled: true
      push.apns.topic: org.example.garden
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Push__Apns__PrivateKeyPem
            valueFrom:
              secretKeyRef:
                name: coldframe-push
                key: apns-key.p8
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Push__Apns__KeyId
            valueFrom:
              secretKeyRef:
                name: coldframe-push
                key: apns-key-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Push__Apns__TeamId
            valueFrom:
              secretKeyRef:
                name: coldframe-push
                key: apns-team-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Push__Apns__Topic
            value: org.example.garden
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: Push__Fcm__ServiceAccountJson

  - it: reads the Firebase service account from the contract when FCM is enabled, and nothing of APNs
    template: templates/deployment.yaml
    set:
      push.fcm.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Push__Fcm__ServiceAccountJson
            valueFrom:
              secretKeyRef:
                name: coldframe-push
                key: fcm-service-account.json
      - notContains:
          path: spec.template.spec.containers[0].env
          any: true
          content:
            name: Push__Apns__PrivateKeyPem

  - it: refuses APNs without a topic
    template: templates/deployment.yaml
    set:
      push.apns.enabled: true
      push.apns.topic: ""
    asserts:
      - failedTemplate:
          errorMessage: "push.apns.topic is required: the bundle ID of the iOS app"

  - it: reads the database credentials and the client secret from the contract
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: coldframe-db-coldframe
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: coldframe-db-coldframe
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: Keycloak__ClientSecret
            valueFrom:
              secretKeyRef:
                name: coldframe-oidc-clients
                key: server-client-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ConnectionStrings__coldframe
            value: Host=coldframe-db-rw;Port=5432;Database=coldframe;Username=$(DB_USERNAME);Password=$(DB_PASSWORD)

  - it: gives the migration Job the same database credentials
    template: templates/migrations-job.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: coldframe-db-coldframe
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: coldframe-db-coldframe
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ConnectionStrings__coldframe
            value: Host=coldframe-db-rw;Port=5432;Database=coldframe;Username=$(DB_USERNAME);Password=$(DB_PASSWORD)
