# Fleet bundle "server" (Story 2.5a): the chart in this folder as release "server" in namespace
# coldframe (deploy/charts/README.md). Site values: the identity authority; the chart's defaults
# name the in-cluster services. The migration hook Job runs before every install and upgrade and
# must succeed before the Deployment (strategy Recreate) changes: timeoutSeconds bounds it.
defaultNamespace: coldframe
labels:
  coldframe.escendit.io/bundle: server
dependsOn:
  - selector:
      matchLabels:
        coldframe.escendit.io/bundle: nats
  - selector:
      matchLabels:
        coldframe.escendit.io/bundle: temporal
  - selector:
      matchLabels:
        coldframe.escendit.io/bundle: keycloak
helm:
  releaseName: server
  timeoutSeconds: 900
  # Site values: key "server" of the ConfigMap coldframe-values
  # (deploy/fleet/values.example.yaml).
  valuesFrom:
    - configMapKeyRef:
        name: coldframe-values
        namespace: coldframe
        key: server
