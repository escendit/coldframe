# Fleet bundle "cloudnative-pg" (Story 2.5a): the CloudNativePG operator and its CRDs from the
# upstream Helm chart, pinned in deploy/charts/dependencies.env (CNPG_HELM_REPO,
# CNPG_CHART_VERSION: chart 0.29.1 ships CloudNativePG 1.30.1). No dependencies.
#
# fullnameOverride keeps the names of the release manifest (deployment/cnpg-controller-manager,
# service/cnpg-webhook-service); takeOwnership adopts the objects of a kubectl-installed operator,
# except its Deployment: the chart's selector differs from the manifest's and spec.selector is
# immutable, so that Deployment must be deleted before the GitRepo is applied
# (docs/operations/install.md, "Moving from a manual install").
defaultNamespace: cnpg-system
labels:
  coldframe.escendit.io/bundle: cloudnative-pg
helm:
  releaseName: cnpg
  repo: https://cloudnative-pg.github.io/charts
  chart: cloudnative-pg
  version: 0.29.1
  takeOwnership: true
  timeoutSeconds: 600
  values:
    fullnameOverride: cnpg-controller-manager
