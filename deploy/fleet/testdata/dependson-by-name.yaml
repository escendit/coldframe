# check-fleet.py fixture (merged over the repository's bundles): web depends on a GitRepo-derived
# bundle name instead of the label.
apiVersion: fleet.cattle.io/v1alpha1
kind: Bundle
metadata:
  name: coldframe-deploy-charts-web
spec:
  dependsOn:
    - name: coldframe-deploy-charts-server
    - selector:
        matchLabels:
          coldframe.escendit.io/bundle: keycloak
