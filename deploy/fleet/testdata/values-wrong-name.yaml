# check-fleet.py fixture (in place of values.example.yaml): the ConfigMap has another name than the
# one the bundles read.
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-values
  namespace: coldframe
data:
  database: |
    backup:
      endpointURL: https://<s3-endpoint>
      destinationPath: s3://<bucket>/coldframe/
  keycloak: |
    hostname: auth.<domain>
  web: |
    origin: https://<domain>
  server: |
    identity:
      authority: https://auth.<domain>/realms/coldframe
  ingress: |
    domain: <domain>
