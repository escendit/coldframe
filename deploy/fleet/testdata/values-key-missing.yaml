# check-fleet.py fixture (in place of values.example.yaml): the ingress key is missing, so the
# ingress bundle has no domain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coldframe-values
  namespace: coldframe
data:
  database: |
    backup:
      endpointURL: https://<s3-endpoint>
      destinationPath: s3://<bucket>/coldframe/
  keycloak: |
    hostname: auth.<domain>
  web: |
    origin: https://<domain>
  server: |
    identity:
      authority: https://auth.<domain>/realms/coldframe
