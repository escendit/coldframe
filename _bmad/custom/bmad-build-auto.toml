[workflow]
activation_steps_prepend = [
    "Invoke the gzp-pipeline skill before any other work: gzp-pipeline is the sole owner of Zoho task status and time-log sessions. Let it resume in-flight state or start tracking for this iteration before this workflow proceeds to its own steps. This run is unattended: gzp-pipeline must not ask questions or wait for a human — if it cannot proceed (required config unresolved, or a prior task's PR still awaiting merge), it reports the blocker and this workflow must HALT with status blocked, naming that blocker. One exception: when the prior task's PR is held back only by checks that are still pending or in progress (none failed, no conflict, no required review), that is not a blocker yet — re-read the PR's checks every 2 minutes for up to 45 minutes, merge it as soon as they are green and continue; HALT with status blocked only when a check fails or the checks are still pending after 45 minutes. Do not duplicate task/time tracking here.",
]
on_complete = "Invoke the gzp-pipeline skill to hand off completion of this iteration's work: it drives code-touching changes through GitHub Flow (tracking issue when configured, branch, commit, push, PR — self-assigned, labeled) if that has not already happened, updates the Zoho task's status, and closes out the time-log session opened at activation. This run is unattended: at the merge gate gzp-pipeline accepts its own PR — it merges once checks are green (loop auto-merge, on by default) — and when the merge is blocked or loop auto-merge is off it leaves the PR open and returns; it never waits for a human and never forces a merge. Do not commit, push, open a PR, or touch Zoho directly from this workflow's own steps — gzp-pipeline owns that lifecycle end to end.\n"
