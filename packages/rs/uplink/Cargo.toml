[package]
name = "coldframe-uplink"
description = "Coldframe Hub uplink: BSSID choice, reconnect backoff, SNTP bootstrap and signed heartbeats (AD-11, AD-12, H-1)"
version.workspace = true
edition.workspace = true
# The Hub firmware links this crate with the `esp` toolchain (Rust 1.95), so it stays buildable there.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true

# no_std, no alloc, no esp crate: the logic runs over the coldframe-hal traits only (AD-24).
# Exact versions (AD-15); Cargo.lock pins the rest.
[dependencies]
coldframe-crypto = { path = "../crypto" }
coldframe-hal = { path = "../hal" }
heapless = { version = "=0.9.3", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
serde-json-core = { version = "=0.6.0", default-features = false }

[lints]
workspace = true
