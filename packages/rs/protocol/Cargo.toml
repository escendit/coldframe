[package]
name = "coldframe-protocol"
description = "Coldframe wire messages generated from packages/proto with micropb (no_std, no alloc)"
version.workspace = true
edition.workspace = true
# The Hub firmware links this crate with the `esp` toolchain (Rust 1.95), so it stays buildable there.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

# no_std, no alloc: the firmware links this crate. Exact versions (AD-15); Cargo.lock pins the rest.
[dependencies]
heapless = { version = "=0.9.3", default-features = false }
micropb = { version = "=0.6.0", default-features = false, features = ["encode", "decode", "enable-64bit", "container-heapless-0-9"] }

# Code generation in pure Rust: protox compiles the .proto files, so no `protoc` is needed.
[build-dependencies]
micropb-gen = "=0.6.0"
protox = "=0.9.1"

[lints]
workspace = true
