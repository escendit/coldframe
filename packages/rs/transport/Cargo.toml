[package]
name = "coldframe-transport"
description = "Coldframe Node transport: flash-backed report buffer, sealed NodeFrames over ESP-NOW, sealed acknowledgements, channel following and the clock rule (AD-9, AD-11, AD-17, N-1, N-2)"
version.workspace = true
edition.workspace = true
# The Node firmware links this crate with the `esp` toolchain (Rust 1.95), so it stays buildable there.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true

# no_std, no alloc, no esp crate: the logic runs over the coldframe-hal traits only (AD-24).
# Exact versions (AD-15); Cargo.lock pins the rest.
[dependencies]
coldframe-crypto = { path = "../crypto" }
coldframe-hal = { path = "../hal" }
coldframe-protocol = { path = "../protocol" }
coldframe-sensing = { path = "../sensing" }
heapless = { version = "=0.9.3", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true
