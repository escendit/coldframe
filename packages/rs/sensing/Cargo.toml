[package]
name = "coldframe-sensing"
description = "Coldframe Node wake cycle: power-switched measurement, persisted reading_seq and boot counters, battery mapping and sleep scheduling (AD-11, AD-17, FR4)"
version.workspace = true
edition.workspace = true
# The Node firmware links this crate with the `esp` toolchain (Rust 1.95), so it stays buildable there.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true

# no_std, no alloc, no esp crate: the logic runs over the coldframe-hal traits only (AD-24).
# Exact versions (AD-15); Cargo.lock pins the rest.
[dependencies]
coldframe-hal = { path = "../hal" }
heapless = { version = "=0.9.3", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }

[lints]
workspace = true
