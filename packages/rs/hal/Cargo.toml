[package]
name = "coldframe-hal"
description = "Hardware abstraction traits for Coldframe firmware, with mocks for host-side tests"
version.workspace = true
edition.workspace = true
# The Hub firmware links this crate with the `esp` toolchain (Rust 1.95), so it stays buildable there.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true

# The traits are no_std without alloc and have no required dependencies (AD-24). Optional hmac and
# sha2, and std, come in only behind the `mock` feature for the host-side mocks. Exact versions (AD-15); Cargo.lock pins the rest.
[dependencies]
hmac = { version = "=0.13.0", default-features = false, optional = true }
sha2 = { version = "=0.11.0", default-features = false, optional = true }

[features]
default = []
# Std-only mock implementations of every trait, for host-side tests.
mock = ["dep:hmac", "dep:sha2"]

[lints]
workspace = true
