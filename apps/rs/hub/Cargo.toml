# Hub firmware for the ESP32-S3. Built with the `esp` toolchain, outside the host workspace in the
# repository root; its logic lives in the host-tested crates under packages/rs (AD-24).
[package]
name = "coldframe-hub"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/escendit/coldframe"
publish = false
description = "Coldframe Hub firmware: hardware-bound identity, BLE setup, then (Story 3.5) heartbeats"

# Exact versions (AD-15), the esp stack the radio spike validated; Cargo.lock pins the rest.
[dependencies]
coldframe-crypto = { path = "../../../packages/rs/crypto" }
coldframe-hal = { path = "../../../packages/rs/hal" }
coldframe-protocol = { path = "../../../packages/rs/protocol" }
coldframe-setup = { path = "../../../packages/rs/setup" }
embassy-executor = "=0.10.0"
embassy-futures = "=0.1.2"
embassy-sync = "=0.8.0"
embassy-time = "=0.5.1"
esp-alloc = { version = "=0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "=0.20.0", features = ["panic-handler", "println", "esp32s3"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"] }
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable", "log-04"] }
esp-println = { version = "=0.18.0", features = ["esp32s3", "log-04"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "unstable", "log-04", "wifi", "ble", "coex"] }
esp-rtos = { version = "=0.4.0", features = ["esp32s3", "esp-radio", "embassy", "log-04"] }
esp-storage = { version = "=0.10.0", features = ["esp32s3"] }
heapless = { version = "=0.9.3", default-features = false }
log = "=0.4.34"
nb = "=1.1.0"
static_cell = "=2.1.1"
trouble-host = { version = "=0.7.0", features = ["default-packet-pool-mtu-255", "derive"] }

[features]
default = []
# Software identity root in the `cf_ident` flash partition instead of an eFuse burn. Debug builds
# only: a release build with it enabled fails to compile (AD-12).
dev-mode = []

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = true
debug-assertions = false
lto = "fat"
codegen-units = 1

[lints.rust]
# Only the ROM eFuse adapter (src/board/efuse.rs) may use `unsafe`, and it says why.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
