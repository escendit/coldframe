[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
# Flashes the partition table with the Coldframe data partitions `cf_ident`, `cf_seq` and `cf_boot`.
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = [
  "-C", "link-arg=-Wl,-Tlinkall.x",
  "-C", "link-arg=-nostartfiles",
]

# No [env] table: the image must not pick up build-time environment. The log level is set in code.

[unstable]
build-std = ["alloc", "core"]
