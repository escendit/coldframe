# Node firmware for the ESP32-S3. Built with the `esp` toolchain, outside the host workspace in the
# repository root; its logic lives in the host-tested crates under packages/rs (AD-24).
[package]
name = "coldframe-node"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/escendit/coldframe"
publish = false
description = "Coldframe Node firmware: hardware-bound identity, wake, measure and deep sleep"

# Exact versions (AD-15), the esp stack of the Hub (apps/rs/hub); Cargo.lock pins the rest.
[dependencies]
bosch-bme680 = "=1.0.4"
coldframe-crypto = { path = "../../../packages/rs/crypto" }
coldframe-hal = { path = "../../../packages/rs/hal" }
coldframe-sensing = { path = "../../../packages/rs/sensing" }
embassy-executor = "=0.10.0"
embassy-time = "=0.5.1"
esp-alloc = { version = "=0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "=0.20.0", features = ["panic-handler", "println", "esp32s3"] }
# `embedded-storage`: plain NOR writes (no read-erase-rewrite of the sector) for the counters.
embedded-storage = "=0.3.2"
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3", "embedded-storage"] }
esp-hal = { version = "=1.2.2", features = ["esp32s3", "unstable", "log-04"] }
esp-println = { version = "=0.18.0", features = ["esp32s3", "log-04"] }
# Wi-Fi only: the radio is started just to feed the TRNG when a new identity root is drawn.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "unstable", "log-04", "wifi"] }
esp-rtos = { version = "=0.4.0", features = ["esp32s3", "esp-radio", "embassy", "log-04"] }
esp-storage = { version = "=0.10.0", features = ["esp32s3"] }
log = "=0.4.34"
nb = "=1.1.0"
static_cell = "=2.1.1"

[features]
default = []
# Software identity root in the `cf_ident` flash partition instead of an eFuse burn. Debug builds
# only: a release build with it enabled fails to compile (AD-12). Also the only build that logs
# Reading values.
dev-mode = []

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = true
debug-assertions = false
lto = "fat"
codegen-units = 1

[lints.rust]
# Only the ROM eFuse adapter (src/board/efuse.rs) may use `unsafe`, and it says why.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
