# Host-side Cargo workspace: shared crates and their tests.
# Firmware crates target the ESP32-S3 with their own toolchain and stay outside it.
[workspace]
resolver = "3"
members = [
  "packages/rs/crypto",
  "packages/rs/hal",
  "packages/rs/protocol",
  "packages/rs/sensing",
  "packages/rs/setup",
  "packages/rs/uplink",
  "tests/rs/crypto",
  "tests/rs/hal",
  "tests/rs/protocol",
  "tests/rs/sensing",
  "tests/rs/setup",
  "tests/rs/setup-client",
  "tests/rs/uplink",
]
exclude = ["apps/rs"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/escendit/coldframe"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
