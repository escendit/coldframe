org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true
# Android dexing and Robolectric need more than Gradle's 512 MiB default.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Roborazzi snapshot tests compare against the committed baselines in tests/kt/android/snapshots
# on every test run (so `check` fails on a visual change); `./gradlew :android:recordRoborazziDebug`
# rewrites them.
roborazzi.test.verify=true
