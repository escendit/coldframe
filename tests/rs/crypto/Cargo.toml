# Integration tests for coldframe-crypto: the shared vectors of packages/crypto-spec/vectors.json,
# the RFC anchors and the negative cases. Cargo discovers every file in tests/ on its own.
[package]
name = "coldframe-crypto-tests"
description = "Integration tests for coldframe-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
coldframe-crypto = { path = "../../../packages/rs/crypto" }
coldframe-hal = { path = "../../../packages/rs/hal", features = ["mock"] }
hkdf = "=0.13.0"
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[lints]
workspace = true
